name: C++ CI

on:
    push:
        branches: [main,master]
    pull_request:
        branches: [main, master]

jobs:
    build:
        name: ${{matrix.os}} - Build & Test
        runs-on: ${{matrix.os}}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
            
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
        
            - name: Configure CMake
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=ON

            - name: Build Targets
              run: cmake --build build --config Release

            - name: Run Tests
              working-directory: build
              run: ctest -C Release --output-on-failure

    asan:
        name: Ubuntu - ASan
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Configure CMake
            run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_BENCHMARKS=OFF
          
          - name: Build Targets
            run: cmake --build build-asan --config Debug -j
          
          - name: Run Tests
            run: ctest --test-dir build-asan --output-on-failure
            env:
                  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

    tsan:
        name: Ubuntu - TSan
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Configure CMake
            run: cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DBUILD_BENCHMARKS=OFF
          
          - name: Build Targets
            run: cmake --build build-tsan --config Debug -j
          
          - name: Run Tests
            run: ctest --test-dir build-tsan --output-on-failure
            env:
                  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

          

                